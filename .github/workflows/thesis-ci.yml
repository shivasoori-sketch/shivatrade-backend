name: THESIS CI

on:
  push:
    branches:
      - main
      - "cursor/**"
  pull_request:

jobs:
  unit-and-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Pytest (unit + Phase 0 fixtures)
        run: pytest tests/ -m "not integration" --tb=short -q
      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-report
          path: tests/reconciliation/reconciliation_report.json
          if-no-files-found: ignore

  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/reconciliation/ -q

  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_thesis_engine.py tests/test_book_engine.py tests/test_pipeline_v2.py -q

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/golden/ -q

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/benchmark/ -q

  wick-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/wick_replay/ -q

  kd-retire-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: KD /api/kaaldrishti/latest must be 404
        run: bash scripts/check_kd_404.sh

  no-preview-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: No preview=live in source
        run: PYTHONPATH=. pytest tests/test_adviser_demo_contract.py::test_no_preview_live_string_in_source -q

  behavior-anti-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build THESIS card bundle for grep tests
        run: |
          cd ui-live/kaaldrishti-preview/thesis-card
          npm ci
          npm run build
          cp dist/thesis-card.js dist/thesis-card.css .
      - name: Anti-chart behavior (required for merge)
        run: PYTHONPATH=. pytest tests/behavior/ -q
